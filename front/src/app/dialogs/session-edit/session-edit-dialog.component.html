<div class="dlg">
	<header class="dlg-head">
		<h2 class="dlg-title geconomicusFont" mat-dialog-title>{{ 'MASTER.EDIT' | translate }}</h2>
	</header>
	<div class="dlg-body">
		<label>
			<span class="dlg-field-label">📝 {{ 'MASTER.SESSION_NAME' | translate }}</span>
			<input class="dlg-field" type="text" [(ngModel)]="session.name" />
		</label>
		<label>
			<span class="dlg-field-label">👤 {{ 'MASTER.ANIMATOR' | translate }}</span>
			<input class="dlg-field" type="text" [(ngModel)]="session.animator" />
		</label>
		<label>
			<span class="dlg-field-label">📍 {{ 'MASTER.LOCATION' | translate }}</span>
			<input class="dlg-field" type="text" [(ngModel)]="session.location" />
		</label>
		<label>
			<span class="dlg-field-label">🎨 {{ 'THEME.TITLE' | translate }}</span>
			<select class="dlg-field" [(ngModel)]="session.theme">
				<option *ngFor="let theme of themes" [ngValue]="theme">{{ theme | translate }}</option>
			</select>
		</label>
		<div class="dlg-section">
			<div class="dlg-row">
				<span class="dlg-label">{{ 'MASTER.DEV_MODE' | translate }}</span>
				<mat-slide-toggle [(ngModel)]="session.devMode"></mat-slide-toggle>
			</div>
		</div>
	</div>
	<footer class="dlg-actions">
		<button mat-stroked-button [mat-dialog-close]="null">{{ 'CANCEL' | translate }}</button>
		<span class="dlg-spacer"></span>
		<button *ngIf="session.devMode" mat-stroked-button color="warn" [mat-dialog-close]="'reopen'">
			{{ 'REOPEN' | translate }}
		</button>
		<button mat-raised-button color="accent" class="box-shadowed" [mat-dialog-close]="session" cdkFocusInitial>
			{{ 'SAVE' | translate }}
		</button>
	</footer>
</div>
