<div class="dlg">
	<header class="dlg-head">
		<h2 class="dlg-title geconomicusFont" mat-dialog-title>{{ 'DIALOG_JOIN_SHORT_CODE.SHORT_ID_TITLE' | translate }}</h2>
	</header>
	<div class="dlg-body">
		<p class="dlg-text">{{ 'DIALOG_JOIN_SHORT_CODE.SHORT_ID_DESC' | translate }}</p>
		<div class="code-field">
			<input
				class="dlg-field code-input"
				type="text"
				placeholder="0042 / 0042-7"
				required
				readonly
				[(ngModel)]="code"
				(keyup.enter)="submit()" />
			<button
				*ngIf="code"
				type="button"
				class="code-clear"
				mat-icon-button
				[attr.aria-label]="'CLEAR' | translate"
				(click)="clear()">
				<fa-icon [icon]="faXmark"></fa-icon>
			</button>
		</div>
		<div class="code-error" *ngIf="error">{{ error | translate }}</div>
		<div class="simple-keyboard"></div>
	</div>
	<footer class="dlg-actions">
		<button mat-stroked-button [mat-dialog-close]="">{{ 'CANCEL' | translate }}</button>
		<span class="dlg-spacer"></span>
		<button mat-raised-button color="primary" class="box-shadowed" [disabled]="!canSubmit" (click)="submit()">
			{{ 'DIALOG_JOIN_SHORT_CODE.SEARCH' | translate }}
		</button>
	</footer>
</div>
