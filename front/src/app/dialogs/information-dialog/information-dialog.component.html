<div class="dlg">
	<header class="dlg-head">
		<h2 class="dlg-title geconomicusFont" mat-dialog-title>{{ title | translate }}</h2>
	</header>
	<div class="dlg-body">
		<p class="dlg-text" [innerHTML]="message | translate"></p>
		<p *ngIf="message2" class="dlg-text" [innerHTML]="message2 | translate"></p>
	</div>
	<footer class="dlg-actions">
		<button-timer [secondsTimer]="timerBtn" [label]="labelBtn | translate" (timerEnd)="timerEnd()"></button-timer>
	</footer>
</div>
