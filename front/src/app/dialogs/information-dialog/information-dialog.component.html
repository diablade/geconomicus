<h1 (click)="back()" mat-dialog-title>{{ title | translate }}</h1>
<div (click)="back()" mat-dialog-content>
	<p [innerHTML]="message | translate"></p>
	<p *ngIf="message2" [innerHTML]="message2 | translate"></p>
</div>
<div mat-dialog-actions class="d-flex justify-content-end">
	<button-timer [secondsTimer]="timerBtn" [label]="labelBtn | translate" (timerEnd)="back()"></button-timer>
</div>
