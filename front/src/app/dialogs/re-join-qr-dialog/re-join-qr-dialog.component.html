<div class="dlg">
	<div class="dlg-body qr-body">
		<div class="qr">
			<ngx-kjua [text]="data.url" [size]="200" [render]="'svg'"></ngx-kjua>
		</div>
		<div class="qr-name geconomicusFont" [ngStyle]="{ 'font-size': data.textSize }">{{ data.text }}</div>
	</div>
	<footer class="dlg-actions">
		<button mat-raised-button color="accent" class="box-shadowed" mat-dialog-close>{{ 'CLOSE' | translate }}</button>
	</footer>
</div>
