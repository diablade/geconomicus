<div class="dlg">
	<header class="dlg-head">
		<h2 class="dlg-title geconomicusFont" mat-dialog-title>{{ title | translate }}</h2>
	</header>
	<div class="dlg-body">
		<p class="dlg-text">{{ message | translate }}</p>
		<p *ngIf="message2" class="dlg-text">{{ message2 | translate }}</p>
	</div>
	<footer class="dlg-actions">
		<ng-container *ngIf="btn1Enable">
			<button mat-stroked-button [color]="styleBtnCancel" [mat-dialog-close]="'btnCancel'">
				{{ labelBtnCancel | translate }}
			</button>
			<span class="dlg-spacer"></span>
		</ng-container>
		<button
			*ngIf="!autoClickBtnConfirm"
			class="box-shadowed"
			mat-raised-button
			[color]="styleBtnConfirm"
			[mat-dialog-close]="'btnConfirm'">
			{{ labelBtnConfirm | translate }}
		</button>
		<button-timer
			*ngIf="autoClickBtnConfirm"
			[secondsTimer]="timerBtnConfirm"
			[label]="labelBtnConfirm"
			(timerEnd)="timerEnd()"></button-timer>
	</footer>
</div>
