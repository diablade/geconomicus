<div class="dlg">
	<header class="dlg-head">
		<h2 class="dlg-title geconomicusFont" mat-dialog-title>{{ 'DIALOG.QR_SCAN.TITLE' | translate }}</h2>
	</header>
	<div class="dlg-body">
		<div class="scanner">
			<ngx-scanner-qrcode #action="scanner" [config]="config" (event)="onEvent($event, action)"></ngx-scanner-qrcode>
		</div>
		<div>
			<label class="dlg-field-label" for="scanCamera">{{ 'DIALOG.QR_SCAN.CAMERA' | translate }}</label>
			<select id="scanCamera" class="dlg-field" #select1 (change)="cameraChanged(select1.value)" required>
				<option [value]="null" selected>{{ 'DIALOG.QR_SCAN.SELECT_DEVICE' | translate }}</option>
				<option
					*ngFor="let c of action.devices.value; let i = index"
					[value]="c.deviceId"
					[selected]="i == action.deviceIndexActive">
					{{ c.label }}
				</option>
			</select>
		</div>
	</div>
	<footer class="dlg-actions">
		<button mat-stroked-button (click)="closeDialog()">{{ 'CANCEL' | translate }}</button>
	</footer>
</div>
