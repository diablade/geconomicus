<!-- Carte dans la grille -->
<div
	*ngIf="state === 'default'"
	class="card"
	[class.box-shadowed]="shadow"
	[ngClass]="[card.color]"
	[style.width]="width"
	[style.height]="height">
	<div class="face" (click)="cardClicked()">
		<div [style.font-size]="iconSize" class="card-icon emoji" [ngClass]="typeTheme === 'TWEMOJI' ? 'twemoji' : ''">
			{{ getIcon(card.key) }}
		</div>
		<div [style.font-size]="textSize" class="card-text">{{ card.key | translate }}</div>
		<div [style.font-size]="letterSize" [style.line-height]="letterSize" class="card-letter contour">
			&nbsp;{{ card.letter }}&nbsp;
		</div>
	</div>
</div>

<!-- Placeholder : garde la place dans la grille pendant que la carte est dans l'overlay -->
