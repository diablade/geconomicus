<ng-container *ngIf="avatar">
	<app-version></app-version>
	<div
		class="bgFixedLayer"
		[ngClass]="avatar!.boardConf"
		[ngStyle]="getBackgroundStyle(avatar!.boardConf, avatar!.boardColor)"></div>
	<div class="settings-scroll aboveBg">
		<div class="settings">
			<header class="topbar">
				<h1 class="title shadowed">{{ 'AVATAR.YOUR_AVATAR' | translate }}</h1>
				<app-language-btn [short]="true"></app-language-btn>
			</header>

			<section class="frame frame-glass preview">
				<div class="avatar-wrap">
					<avatar [avatar]="avatar!" [width]="'150px'" [height]="'150px'"></avatar>
					<button
						data-pop
						class="random-btn box-shadowed"
						mat-mini-fab
						color="warn"
						[matTooltip]="'AVATAR.RANDOMIZE' | translate"
						[attr.aria-label]="'AVATAR.RANDOMIZE' | translate"
						(click)="randomize()">
						<fa-icon [icon]="faWandMagicSparkles"></fa-icon>
					</button>
				</div>
			</section>

			<section class="frame frame-glass name-block">
				<label class="field-label" for="avatarName">{{ 'AVATAR.NAME' | translate }}</label>
				<input
					id="avatarName"
					class="field"
					type="text"
					autocomplete="nickname"
					enterkeyhint="done"
					[(ngModel)]="avatar.name"
					(keydown.enter)="saveAndClose()" />
			</section>

			<section class="frame frame-glass colors">
				<div class="color-row">
					<span class="row-label">{{ 'AVATAR.SKIN' | translate }}</span>
					<ngx-colors
						[palette]="skinPalette"
						[acceptLabel]="'SAVE' | translate"
						[cancelLabel]="'CANCEL' | translate"
						ngx-colors-trigger
						(change)="changeSkin()"
						[(ngModel)]="skin"></ngx-colors>
				</div>
				<div class="color-row">
					<span class="row-label">{{ 'AVATAR.HAIR' | translate }}</span>
					<ngx-colors
						[palette]="hairPalette"
						[acceptLabel]="'SAVE' | translate"
						[cancelLabel]="'CANCEL' | translate"
						ngx-colors-trigger
						(change)="changeHairColor()"
						[(ngModel)]="hairColor"></ngx-colors>
				</div>
			</section>

			<section class="frame frame-glass traits">
				<div class="trait" *ngFor="let trait of traits">
					<span class="row-label">{{ trait.label | translate }}</span>
					<div class="stepper">
						<button
							data-pop
							class="box-shadowed"
							mat-mini-fab
							color="accent"
							[attr.aria-label]="('AVATAR.PREVIOUS' | translate) + ' ' + (trait.label | translate)"
							(click)="trait.step(false)">
							<fa-icon [icon]="faChevronLeft"></fa-icon>
						</button>
						<span class="trait-value">
							{{ $any(avatar)[trait.key] + 1 }}/{{ properties[trait.key].default.length }}
						</span>
						<button
							data-pop
							class="box-shadowed"
							mat-mini-fab
							color="accent"
							[attr.aria-label]="('AVATAR.NEXT' | translate) + ' ' + (trait.label | translate)"
							(click)="trait.step(true)">
							<fa-icon [icon]="faChevronRight"></fa-icon>
						</button>
					</div>
				</div>
			</section>

			<section class="frame frame-glass board">
				<h2 class="row-label">{{ 'AVATAR.GAME_TABLE' | translate }}</h2>
				<mat-radio-group class="board-grid" [(ngModel)]="avatar.boardConf">
					<mat-radio-button value="bgWood">
						<img class="thumbnail-bg" src="assets/images/wood.png" alt="" />
					</mat-radio-button>
					<mat-radio-button value="bgGreen">
						<img class="thumbnail-bg" src="assets/images/green.png" alt="" />
					</mat-radio-button>
					<mat-radio-button *ngFor="let gradient of boardGradients" [value]="gradient">
						<div class="thumbnail-bg" [ngClass]="gradient"></div>
					</mat-radio-button>
					<mat-radio-button value="bgCustom">
						<ngx-colors
							class="thumbnail-custom"
							[acceptLabel]="'SAVE' | translate"
							[cancelLabel]="'CANCEL' | translate"
							[palette]="boardPalette"
							ngx-colors-trigger
							[format]="'string'"
							[(ngModel)]="avatar.boardColor"></ngx-colors>
					</mat-radio-button>
				</mat-radio-group>
			</section>

			<footer class="frame frame-glass actions">
				<button data-pop (click)="close()" class="big-btn box-shadowed" mat-raised-button color="accent">
					{{ 'CANCEL' | translate }}
				</button>
				<button data-pop (click)="saveAndClose()" class="big-btn box-shadowed" mat-raised-button color="primary">
					{{ 'SAVE' | translate }}
				</button>
			</footer>
		</div>
	</div>
</ng-container>
