<div class="bgGradien7 bgFixedLayer"></div>
<div class="join-scroll aboveBg">
	<div class="join">
		<h1 class="title shadowed geconomicusFont">{{ 'JOIN.TITLE' | translate }}</h1>

		<!--  GUNY  -->
		<div class="guny-block">
			<bulle [pointer]="true" [contents]="['JOIN.GUNY_INTRO', 'JOIN.GUNY_INTRO2']"></bulle>
			<img class="guny halo" src="./assets/images/guny.png" alt="" />
		</div>

		<form class="frame frame-glass join-form" (ngSubmit)="join()">
			<div class="notice" *ngIf="fromUnknownAvatar">
				{{ 'JOIN.UNKNOWN_AVATAR_NOTICE' | translate }}
			</div>
			<label class="field-label" for="joinName">{{ 'JOIN.NAME_PROMPT' | translate }}</label>
			<input
				id="joinName"
				name="name"
				class="field"
				type="text"
				autocomplete="nickname"
				enterkeyhint="go"
				required
				[(ngModel)]="name" />
			<button
				mat-raised-button
				type="submit"
				class="big-btn box-shadowed go-btn"
				color="primary"
				data-pop
				[disabled]="!name.trim() || joining">
				{{ 'JOIN.GO_BUTTON' | translate }}
			</button>
		</form>
	</div>
</div>
