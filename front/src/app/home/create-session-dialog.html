<div class="dlg">
	<header class="dlg-head">
		<h2 class="dlg-title geconomicusFont" mat-dialog-title>{{ 'DIALOG_CREATE_SESSION.TITLE' | translate }}</h2>
	</header>
	<div class="dlg-body">
		<label>
			<span class="dlg-field-label">{{ 'DIALOG_CREATE_SESSION.NAME' | translate }}</span>
			<input class="dlg-field" required [(ngModel)]="name" />
		</label>
		<label>
			<span class="dlg-field-label">{{ 'DIALOG_CREATE_SESSION.ANIMATOR' | translate }}</span>
			<input class="dlg-field" required [(ngModel)]="animator" />
		</label>
		<label>
			<span class="dlg-field-label">{{ 'DIALOG_CREATE_SESSION.LOCATION' | translate }}</span>
			<input class="dlg-field" required [(ngModel)]="location" />
		</label>
		<label>
			<span class="dlg-field-label">{{ 'DIALOG_CREATE_SESSION.THEME' | translate }}</span>
			<select class="dlg-field" required [(ngModel)]="theme">
				<option *ngFor="let theme of themes" [ngValue]="theme">{{ theme | translate }}</option>
			</select>
		</label>
	</div>
	<footer class="dlg-actions">
		<button mat-stroked-button (click)="onNoClick()">{{ 'DIALOG_CREATE_SESSION.BTN2' | translate }}</button>
		<span class="dlg-spacer"></span>
		<button
			mat-raised-button
			color="accent"
			class="box-shadowed"
			[disabled]="!name || !animator || !location || !theme"
			[mat-dialog-close]="{ name, location, animator, theme }"
			cdkFocusInitial>
			{{ 'DIALOG_CREATE_SESSION.BTN1' | translate }}
		</button>
	</footer>
</div>
