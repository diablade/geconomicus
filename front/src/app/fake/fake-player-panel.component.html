<!-- Always-on-top toggle -->
<button type="button" class="fake-fab" (click)="toggleOpen()">🧪</button>

<div class="fake-panel" *ngIf="open">
	<div class="fake-section">
		<span class="fake-label">Mode</span>
		<button type="button" class="fake-btn" (click)="toggleMoney()">{{ isJune ? '🌱 June' : '💶 Debt' }}</button>
		<button type="button" class="fake-btn" (click)="cycleTheme()">🎨 {{ themeLabel }}</button>
		<button type="button" class="fake-btn" [class.on]="autoSeizure" (click)="toggleAutoSeizure()">
			{{ autoSeizure ? '🚓 autoSeizure ON' : '🚓 autoSeizure OFF' }}
		</button>
	</div>

	<div class="fake-section">
		<span class="fake-label">Overlays</span>
		<button type="button" class="fake-btn" (click)="testReincarnate()">☠️→👶 Reincarnate</button>
		<button type="button" class="fake-btn" (click)="testHalfway()">⏰ Halfway 50%</button>
		<button type="button" class="fake-btn" (click)="testAlarm()">⚠️ Alarm 1mn</button>
		<button type="button" class="fake-btn" (click)="testRateZero()">0️⃣ Rate 0%</button>
		<button type="button" class="fake-btn" (click)="testFault()">🚨 Fault</button>
		<button type="button" class="fake-btn" (click)="testTakeover()">🎬 Take-over</button>
		<button type="button" class="fake-btn" (click)="testPrison()">🔒 Prison</button>
		<button type="button" class="fake-btn" (click)="testPrisonFree()">🕊️ Prison over</button>
		<button type="button" class="fake-btn" [class.on]="showProdGroup" (click)="toggleProdGroup()">
			🏭 {{ showProdGroup ? 'Hide group' : 'Show group' }}
		</button>
		<button type="button" class="fake-btn" (click)="triggerProduction()">🎁 Reveal</button>
		<button type="button" class="fake-btn" [class.on]="showWheel" (click)="toggleWheel()">🎡 Wheel</button>
	</div>

	<div class="fake-section">
		<span class="fake-label">Credit</span>
		<button type="button" class="fake-btn" (click)="setCreditRemaining(240)">🟢 4:00 left</button>
		<button type="button" class="fake-btn" (click)="setCreditRemaining(120)">🟠 2:00 left</button>
		<button type="button" class="fake-btn" (click)="setCreditRemaining(45)">🔴 0:45 left</button>
		<button type="button" class="fake-btn" (click)="testRateDialog()">💱 New rate dialog</button>
		<button type="button" class="fake-btn" (click)="testRefused()">🚫 Refused</button>
		<button type="button" class="fake-btn" (click)="testSettled()">✅ Settled</button>
	</div>

	<div class="fake-section">
		<span class="fake-label">Sounds</span>
		<button type="button" class="fake-btn sound" *ngFor="let key of soundKeys" (click)="playSound(key)">
			🔊 {{ key }}
		</button>
	</div>

	<div class="fake-section">
		<span class="fake-label">Haptics</span>
		<button type="button" class="fake-btn" *ngFor="let tier of hapticTiers" (click)="vibrateTier(tier)">
			📳 {{ tier }}
		</button>
	</div>
</div>

<!-- Hosted instances of the extracted components -->
<app-overlay
	*ngIf="overlayConfig"
	[config]="overlayConfig"
	(done)="onOverlayDone()"
	(action)="onOverlayDone()"></app-overlay>

<app-prison *ngIf="showPrison" [prison]="fakePrison"></app-prison>

<div class="wheel-host" *ngIf="showWheel" (click)="toggleWheel()">
	<div class="wheel"></div>
</div>

<div class="fake-prod-host" *ngIf="showProdGroup">
	<app-square-zone
		[group]="showProdGroup"
		[typeMoney]="'debt'"
		[typeTheme]="'EMOJI'"
		[ownerIdx]="0"
		[gameStateId]="'fake'"
		[currentDU]="2"
		[allCards]="showProdGroup.cards"
		[amountCardsForProd]="4"
		[generatedIdenticalLetters]="4"
		[revealMs]="7000"
		[screenWidth]="screenWidth"
		[screenHeight]="screenHeight"></app-square-zone>
</div>
